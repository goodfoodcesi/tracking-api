services:
  trackingapi:
    build: .
    expose:
      - "8080"
    environment:
      - Env=dev
      - APIPort=:8080
      - DBHost=ip
      - APISecret=your-super-secret-jwt-token-with-at-least-32-characters-long
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracking.rule=Host(`api.goodfood.dev`) && PathPrefix(`/tracking`)"
      - "traefik.http.routers.tracking.entrypoints=web"
      - "traefik.http.services.tracking.loadbalancer.server.port=8080"
      - "traefik.docker.network=shared-rabbitmq-network"

networks:
  default:
    external: true
    name: goodfood-api